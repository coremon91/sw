<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; color: #202124; font: 13px Arial, sans-serif; }
      .preview-toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
      #previewViewport { position: relative; width: 100%; aspect-ratio: 16/9; overflow: hidden; border: 1px solid #aeb4bf; border-radius: 5px; background: #17223c; }
      #previewFrame { position: absolute; width: 1920px; height: 1080px; border: 0; transform-origin: 0 0; pointer-events: none; }
      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px 12px; margin-top: 12px; }
      .wide { grid-column: 1/-1; }
      label { display: block; margin-bottom: 3px; font-weight: 700; }
      input, select { width: 100%; padding: 7px; border: 1px solid #bdc1c6; border-radius: 4px; background: #fff; }
      .range-row { display: grid; grid-template-columns: 1fr 58px; gap: 8px; align-items: center; }
      output { text-align: right; font-variant-numeric: tabular-nums; }
      button { border: 0; border-radius: 4px; padding: 9px; font-weight: 700; cursor: pointer; }
      #refreshPreview, #out { background: #e8eaed; }
      #refreshWeather { background: #c7e5ff; }
      #apply { background: #dfe7f6; }
      #take { background: #1769e0; color: #fff; }
      #updateProgram { background: #f9ab00; }
      .actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; margin-top: 14px; }
      #serviceStatus, #status { margin-top: 8px; font-size: 12px; }
      .ok { color: #188038; } .bad { color: #c5221f; }
    </style>
  </head>
  <body>
    <div class="preview-toolbar">
      <strong>우하단 날씨 · 지역 / 기온 / 시계</strong>
      <button id="refreshPreview" type="button">새로고침</button>
    </div>
    <div id="previewViewport">
      <iframe id="previewFrame" title="날씨 CG 프리뷰" src="/bundles/my-cg/graphics/weather.html?preview=1"></iframe>
    </div>
    <div class="grid"><div class="wide"><label for="weatherApiKey">기상청 API 인증키 (공공데이터포털)</label><input id="weatherApiKey" type="password" autocomplete="new-password" placeholder="Encoding 또는 Decoding 인증키 입력"><button id="saveWeatherApiKey" type="button" style="margin-top:8px">API 키 저장</button><p id="weatherApiKeyStatus" style="font-size:12px">API 설정 확인 중…</p></div>
      <div class="wide">
        <label for="province">자동 조회 지역</label>
        <select id="province">
          <option value="전남광주특별시">전남광주특별시 · 주요 6개 도시</option>
        </select>
      </div>
      <div class="wide"><button id="refreshWeather" type="button" style="width:100%">기상청 API 새로고침</button></div>
      <div class="wide">광주 · 목포 · 여수 · 순천 · 나주 · 광양 순환<br>기온·날씨 5초 자동 조회 · 송출 데이터와 아이콘 자동 반영<br>조회 중에는 중복 요청하지 않으며, 실패하면 마지막 정상 값을 유지합니다. 수동 입력은 다음 자동 조회 성공 시 대체됩니다.</div>
      <div><label for="city">수동 지역명</label><input id="city" maxlength="20" /></div>
      <div><label for="temp">수동 온도</label><input id="temp" maxlength="12" placeholder="25℃" /></div>
      <div class="wide">
        <label for="condition">수동 날씨</label>
        <select id="condition">
          <option>맑음</option><option>구름 많음</option><option>흐림</option>
          <option>비</option><option>눈</option><option>비/눈</option><option>소나기</option>
        </select>
      </div>
      <div><label for="intervalSeconds">지역 전환</label><div class="range-row"><input id="intervalSeconds" type="range" min="2" max="30" /><output id="intervalSecondsOutput"></output></div></div>
      <div><label for="fontSize">지역 글자</label><div class="range-row"><input id="fontSize" type="range" min="20" max="34" /><output id="fontSizeOutput"></output></div></div>
      <div><label for="right">오른쪽 여백</label><div class="range-row"><input id="right" type="range" min="0" max="1200" /><output id="rightOutput"></output></div></div>
      <div><label for="bottom">아래 여백</label><div class="range-row"><input id="bottom" type="range" min="0" max="800" /><output id="bottomOutput"></output></div></div>
      <div class="wide"><label for="width">날씨 너비</label><div class="range-row"><input id="width" type="range" min="90" max="180" /><output id="widthOutput"></output></div></div>
    </div>
    <p><a href="weather-icons.html" target="_blank" rel="noopener">제작된 날씨 이미지 보기</a></p>
    <div id="serviceStatus">날씨 서비스 확인 중…</div>
    <div class="actions">
      <button id="apply">프리뷰 적용</button>
      <button id="take">송출 TAKE</button>
      <button id="updateProgram">송출 반영</button>
      <button id="out">송출 OUT</button>
    </div>
    <div id="status">CG 출력 상태 확인 중…</div>
    <script src="/bundles/my-cg/graphics/broadcast-layout.js"></script>
    <script src="weather.js"></script><script src="weather-api.js"></script>
  </body>
</html>
