<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=1920, height=1080"><title>프로그램 헤드와 자막</title><link rel="stylesheet" href="lower-third.css"></head>
<body>
  <aside id="program-head" aria-hidden="true"><img id="head-image" alt="프로그램 헤드" hidden><span id="head-line1">MORNING</span><strong id="head-line2">WIDE</strong></aside>
  <main id="lower-third" aria-hidden="true">
    <div id="keyword-caption" class="caption-bar keyword-top"><div id="keyword-headline"></div></div>
    <div id="report-caption" class="caption-bar report"><div id="report-headline"></div></div>
    <div id="interview-caption" class="caption-bar interview"><div id="nameplate"><strong id="speaker-name"></strong><span id="speaker-role"></span></div><div id="quote"></div></div>
  </main>
  <aside id="natural-disaster" aria-hidden="true"><div id="natural-badge"><strong id="natural-brand">kbc</strong><span id="natural-label">자연재해</span></div><div id="natural-window"><div id="natural-text"></div></div></aside>
  <link rel="stylesheet" href="natural-disaster.css">
  <script src="studio-layer-filter.js"></script><script src="broadcast-layout.js"></script><script src="caption-layout.js"></script><script src="lower-third.js"></script>
  <script src="natural-disaster-model.js"></script><script src="natural-disaster.js"></script>
</body></html>
